---
instance:
  name: convex_ci

image:
  tag: ci

db:
  host: db.ci.example.com

storage:
  nfs:
    server: nfs.ci.example.com
    path: /exports/concave
    mountPath: /srv/convex

hosts:
  api: api.convex.example.com
  site: convex.example.com

ha:
  standbyReplicas: 1
  requireNodeSpread: false

controlPlane:
  tokenSecretRef:
    name: convex-control-plane

funrun:
  replicas: 2
  hpa:
    enabled: false

dashboard:
  enabled: false
