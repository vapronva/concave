---
instance:
  name: convex_ci

image:
  tag: ci
  pullSecrets:
    - name: registry-credentials

db:
  host: db.ci.example.com
  port: 48081

storage:
  nfs:
    server: nfs.ci.example.com
    path: /exports/concave

hosts:
  api: api.convex.example.com
  site: convex.example.com
  dashboard: dash.convex.example.com

ha:
  standbyReplicas: 2
  spreadTopologyKey: topology.kubernetes.io/zone
  leader:
    nodeSelector:
      node.kubernetes.io/nodegroup: backend
    tolerations:
      - key: dedicated
        operator: Equal
        value: backend
        effect: NoSchedule
  follower:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: follower

insights:
  enabled: true
  sinkUrl: http://bigbrain.convex-system.svc.cluster.local:8081/internal/usage
  queryUrl: http://bigbrain.convex-system.svc.cluster.local:8081

controlPlane:
  tokenSecretRef:
    name: convex-control-plane

sizeLimits:
  writeBytes: 8388608
  readBytes: 8388608

backend:
  corsOrigins:
    - https://app.example.com
  extraEnv:
    - name: RUST_BACKTRACE
      value: "1"
  concurrency:
    queries: 256

resources:
  funrun:
    requests:
      cpu: 500m
      memory: 512Mi

funrun:
  updateStrategy:
    type: Recreate
  nodes:
    - worker-1
  isolate:
    maxWorkers: 1500
    preloadWorkers: 256
  cache:
    indexBytes: 2147483648
  hpa:
    cpuAverageUtilization: 70
    memoryAverageUtilization: 75

ingress:
  ckic:
    cors:
      api:
        originRegexp: ^https://app\.example\.com$
        allowCredentials: true
      site:
        originRegexp: ^https://app\.example\.com$
        maxAge: 7200

dashboard:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: node.kubernetes.io/nodegroup
                operator: In
                values:
                  - web
